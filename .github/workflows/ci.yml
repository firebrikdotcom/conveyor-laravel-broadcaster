name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: xdebug
          tools: composer:v2
      - run: composer validate --strict
      # PHPUnit 13 needs PHP 8.4.1; keep the package runtime floor at Laravel's 8.3.
      - if: matrix.php == '8.3'
        run: composer require --dev 'phpunit/phpunit:^12.5' --no-update --no-interaction
      - run: composer update --no-interaction --prefer-dist
      - run: composer check
      - run: composer coverage
      - run: composer audit
      - run: composer archive --format=zip --dir=coverage --file=conveyor-laravel-broadcaster
